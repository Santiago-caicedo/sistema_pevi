{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | PEVI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #0f172a;
            --foreground: #111827;
            --muted-foreground: #6b7280;
            --border: #e5e7eb;
            --card: #ffffff;
            --radius: 0.9rem;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: var(--foreground);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(circle at 20% 80%, rgba(14,165,233,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(34,197,94,0.06) 0%, transparent 50%);
            animation: subtle-move 20s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes subtle-move {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            50% { transform: translate(-2%,-2%) rotate(1deg); }
        }
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 2.8rem 3rem 2.4rem;
            box-shadow: 0 40px 80px rgba(0,0,0,0.4), 0 20px 40px rgba(0,0,0,0.3);
        }
        .brand-top {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .brand-top img {
            height: 70px;
            object-fit: contain;
            display: block;
            margin: 0 auto 0.75rem;
        }
        .brand-top span {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: #9ca3af;
            font-weight: 600;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 0.4rem;
        }
        .subtitle {
            font-size: 0.88rem;
            color: var(--muted-foreground);
            text-align: center;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .form-group { margin-bottom: 1.4rem; }
        .form-label {
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 0.45rem;
            color: #374151;
            display: block;
        }
        .form-input {
            width: 100%;
            padding: 0.9rem 1rem;
            font-size: 0.95rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            background: #f9fafb;
            transition: border-color 0.15s, box-shadow 0.15s, background-color 0.15s;
            font-family: inherit;
        }
        .form-input:focus {
            outline: none;
            background-color: #ffffff;
            border-color: #111827;
            box-shadow: 0 0 0 3px rgba(15,23,42,0.06);
        }
        .btn-primary {
            width: 100%;
            padding: 0.95rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            background: #111827;
            color: #f9fafb;
            margin-top: 0.5rem;
            transition: opacity 0.15s, transform 0.08s, box-shadow 0.15s;
            box-shadow: 0 14px 30px rgba(15,23,42,0.22);
            font-family: inherit;
        }
        .btn-primary:hover { opacity: 0.96; }
        .btn-primary:active { transform: scale(0.98); }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.82rem;
            color: #6b7280;
            text-decoration: none;
            transition: color 0.15s;
        }
        .back-link:hover { color: #111827; }
        @media (max-width: 520px) {
            .card { padding: 2.2rem 1.7rem 2rem; margin: 1rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand-top">
            <img src="{% static 'img/logo_pevi.png' %}" alt="PEVI Colombia">
            <span>Plataforma PEVI</span>
        </div>

        <h1 class="title">Recuperar contraseña</h1>
        <p class="subtitle">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="id_email">Correo electrónico</label>
                <input type="email" id="id_email" name="email" class="form-input" required autofocus placeholder="tu@correo.com">
            </div>
            <button type="submit" class="btn-primary">Enviar enlace</button>
        </form>

        <a href="{% url 'login' %}" class="back-link">Volver al inicio de sesión</a>
    </div>
</body>
</html>
